name: Feature Request
description: Suggest an idea or new feature for CorvoVault
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve CorvoVault! Please describe your proposed feature or enhancement in detail.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is (e.g. "I find it frustrating when...").
      placeholder: Describe the problem or limitation you are experiencing...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see added to CorvoVault.
      placeholder: Describe how the feature should work, UI workflow, or expected behavior...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: Any workarounds or alternative approaches you evaluated...
    validations:
      required: false

  - type: textarea
    id: visual-mocks
    attributes:
      label: Design Mockups or Visual Examples
      description: Add any wireframes, UI mockups, or screenshots of existing tools for reference.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, technical considerations, or links about the feature request here.
    validations:
      required: false
