name: CorvoVault CI

on:
  push:
    branches:
      - main
      - CorvoVault-v2-development-phase
  pull_request:
    branches:
      - main
      - CorvoVault-v2-development-phase

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Typecheck, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: UI Typecheck
        run: npm run typecheck

      - name: Electron Main Process Typecheck
        run: npm run typecheck:electron

      - name: Run Unit Tests
        run: npm run test:rebuild

      - name: Verify Vite Build
        run: npm run build
